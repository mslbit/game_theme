<!--
/**
 * Oceanpayment 通用支付方式模板
 *
 * 5种支付方式共用（Credit Card, Apple Pay, Google Pay, WeChat Pay, Alipay）。
 * 托管收银模式下，用户点击 Place Order 后跳转到 Oceanpayment 完成支付。
 */
-->
<div class="payment-method" data-bind="css: {'_active': (getCode() == isChecked())}">
    <div class="payment-method-title field choice">
        <input type="radio"
               name="payment[method]"
               class="radio"
               data-bind="
                  attr: {'id': getCode()},
                  value: getCode(),
                  checked: isChecked,
                  click: selectPaymentMethod,
                  visible: isRadioButtonVisible()"
               />
        <label class="label" data-bind="attr: {'for': getCode()}">
            <span data-bind="text: getTitle()"></span>
            <img data-bind="attr: {src: getLogoUrl(), alt: getTitle()}"
                 class="payment-method-logo"
                 style="height: 24px; vertical-align: middle; margin-left: 8px;" />
        </label>
    </div>

    <div class="payment-method-content">
        <p class="payment-method-note" data-bind="i18n: 'A secure payment window will open after you place the order.'"></p>

        <div class="payment-method-billing-address">
            <!-- ko foreach: getRegion('billing-address-form') -->
            <!-- ko template: getTemplate() --><!-- /ko -->
            <!-- /ko -->
        </div>

        <div class="checkout-agreements-block">
            <!-- ko foreach: getRegion('before-place-order') -->
            <!-- ko template: getTemplate() --><!-- /ko -->
            <!-- /ko -->
        </div>

        <div class="actions-toolbar">
            <div class="primary">
                <button class="action primary checkout"
                        type="submit"
                        data-bind="
                            click: placeOrder,
                            attr: {title: $t('Place Order')},
                            css: {disabled: !isPlaceOrderActionAllowed()},
                            enable: isPlaceOrderActionAllowed()"
                        disabled>
                    <span data-bind="i18n: 'Place Order'"></span>
                </button>
            </div>
        </div>
    </div>
</div>
